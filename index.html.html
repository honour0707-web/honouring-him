  function loadLecture(id){
    getDb().then(function(db){
      if (!db){
        lectureLoad.pending = false;
        state.lecture = {id:id, loading:false, error:"Can't reach the shared study service on this device right now, so this lecture can't be opened."};
        render();
        return;
      }
      db.doc("lectures/"+id).get().then(function(snap){
        lectureLoad.pending = false;
        if (!snap.exists){
          state.lecture = {id:id, loading:false, error:"That lecture couldn't be found. It may have been deleted."};
        } else {
          var data = snap.data();
          data.loading = false; data.error = null;
          if (!Array.isArray(data.sessions) || !data.sessions.length){
            data.sessions = [{id: uid(), title: data.title||"", blocks: Array.isArray(data.blocks) ? data.blocks : []}];
          }
          data.sessionCount = data.sessionCount || data.sessions.length;
          data.activeSession = 0;
          if (!data.source) data.source = data.studyId ? "study" : "occasion";
          if (!Array.isArray(data.occasionLabels)) data.occasionLabels = data.occasionLabel ? [data.occasionLabel] : [];
          if (!Array.isArray(data.occasionKeys)) data.occasionKeys = data.occasionKey ? [data.occasionKey] : [];
          state.lecture = data;
        }
        render();
      }).catch(function(){
        lectureLoad.pending = false;
        state.lecture = {id:id, loading:false, error:"Couldn't load that lecture just now."};
        render();
      });
    });
  }

  function saveLectureDraft(silent){
    var lec = state.lecture;
    if (!lec) return;
    var msgEl = document.getElementById("lec-savemsg");
    var btn = document.getElementById("lec-save");
    if (!silent){ if (msgEl) msgEl.textContent = "Saving…"; if (btn) btn.disabled = true; }
    getDb().then(function(db){
      if (!db){ if (msgEl) msgEl.textContent = "Can't reach the shared service right now — not saved."; if (btn) btn.disabled=false; return; }
      var doc = {
        id: lec.id, ownerId: lec.ownerId, ownerName: lec.ownerName,
        title: lec.title, source: lec.source,
        targetMinutes: lec.targetMinutes, sessionCount: lec.sessionCount || (lec.sessions?lec.sessions.length:1),
        sessions: (lec.sessions||[]).map(function(s){
          return { id:s.id, title:s.title, blocks:(s.blocks||[]).map(function(b){ return {id:b.id, type:b.type, text:b.text}; }) };
        }),
        createdAt: lec.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      if (lec.source === "study"){
        doc.studyId = lec.studyId; doc.studyTitle = lec.studyTitle;
        doc.weekIndex = lec.weekIndex; doc.weekTheme = lec.weekTheme; doc.weekRef = lec.weekRef;
      } else {
        doc.occasionKeys = lec.occasionKeys||[]; doc.occasionLabels = lec.occasionLabels||[]; doc.occasionCustom = lec.occasionCustom||"";
      }
      lec.createdAt = doc.createdAt;
      db.doc("lectures/"+lec.id).set(doc).then(function(){
        if (msgEl) msgEl.innerHTML = silent ? "" : (ICON_CHECK+" Saved just now");
        if (btn) btn.disabled = false;
      }).catch(function(){
        if (msgEl) msgEl.textContent = "Couldn't save just now. Please try again.";
        if (btn) btn.disabled = false;
      });
    });
  }

  /* ---------- DAILY DEVOTIONAL ---------- */

  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function firstWeekdayOfMonth(y,m){ return new Date(y, m, 1).getDay(); }
  function dateKeyFor(y,m,d){ return y+"-"+pad2(m+1)+"-"+pad2(d); }
  function todayParts(){ var t = new Date(); return {y:t.getFullYear(), m:t.getMonth(), d:t.getDate()}; }
  function todayKey(){ var t = todayParts(); return dateKeyFor(t.y, t.m, t.d); }

  function ensureDevotionalState(){
    if (!state.devotional){
      var t = todayParts();
      state.devotional = {
        viewYear: t.y, viewMonth: t.m, selectedDate: todayKey(),
        content: null, contentForDate: null, contentLoading: false, contentError: null,
        progress: null, progressLoaded: false
      };
    }
    return state.devotional;
  }

  function screenDevotional(){
    var dv = ensureDevotionalState();
    if (!dv.progressLoaded) loadDevotionalProgress();

    var html = '<div class="wrap-narrow">';
    html += '<div style="margin:22px 0 16px;"><span class="eyebrow">Just For You</span><h1 style="font-size:28px;margin-top:4px;">Daily Devotional</h1><p class="muted" style="margin-top:8px;">A short reading, a reflection, and a prayer &mdash; a few minutes with the Word, any day you like.</p></div>';

    if (dv.progress){
      var days = dv.progress.days || {};
      var doneCount = Object.keys(days).filter(function(k){ return days[k]; }).length;
      var streak = 0;
      var cursor = todayParts();
      var cursorKey = dateKeyFor(cursor.y, cursor.m, cursor.d);
      if (!days[cursorKey]){
        var yest = new Date(cursor.y, cursor.m, cursor.d - 1);
        cursorKey = dateKeyFor(yest.getFullYear(), yest.getMonth(), yest.getDate());
      }
      while (days[cursorKey]){
        streak++;
        var parts = cursorKey.split("-");
        var prev = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10)-1);
        cursorKey = dateKeyFor(prev.getFullYear(), prev.getMonth(), prev.getDate());
      }
      html += '<div class="section card-tight no-print" style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px;">' +
        '<div><span class="eyebrow">Completed</span><p style="font-family:var(--font-display);font-size:22px;margin-top:2px;">'+doneCount+'</p></div>' +
        (streak > 0 ? ('<div><span class="eyebrow">Current Streak</span><p style="font-family:var(--font-display);font-size:22px;margin-top:2px;">'+streak+' day'+(streak===1?'':'s')+'</p></div>') : '') +
      '</div>';
    }

    html += '<div class="card no-print">';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">' +
      '<button type="button" class="btn btn-ghost" id="dv-prev">'+ICON_ARROW.replace('d="M9 5l7 7-7 7"','d="M15 5l-7 7 7 7"')+'</button>' +
      '<h3 style="font-family:var(--font-display);font-size:19px;">'+MONTH_NAMES[dv.viewMonth]+' '+dv.viewYear+'</h3>' +
      '<button type="button" class="btn btn-ghost" id="dv-next">'+ICON_ARROW+'</button>' +
    '</div>';
    html += '<div class="dv-grid dv-grid-head">' + ["S","M","T","W","T","F","S"].map(function(d){ return '<span>'+d+'</span>'; }).join("") + '</div>';
    html += '<div class="dv-grid">';
    var offset = firstWeekdayOfMonth(dv.viewYear, dv.viewMonth);
    var total = daysInMonth(dv.viewYear, dv.viewMonth);
    var tKey = todayKey();
    for (var i=0;i<offset;i++) html += '<span></span>';
    for (var d=1; d<=total; d++){
      var key = dateKeyFor(dv.viewYear, dv.viewMonth, d);
      var done = dv.progress && dv.progress.days && dv.progress.days[key];
      var cls = ["dv-day"];
      if (key === tKey) cls.push("today");
      if (key === dv.selectedDate) cls.push("selected");
      if (done) cls.push("done");
      html += '<button type="button" class="'+cls.join(" ")+'" data-dv-date="'+key+'">'+d+(done?'<span class="dv-check">'+ICON_CHECK+'</span>':'')+'</button>';
    }
    html += '</div>';
    html += '</div>';

    html += '<div id="dv-content" style="margin-top:18px;"></div>';
    html += '</div>';
    return html;
  }

  function renderDevotionalContent(){
    var mount = document.getElementById("dv-content");
    if (!mount) return;
    var dv = ensureDevotionalState();
    var key = dv.selectedDate;
    var isToday = key === todayKey();
    var label = isToday ? "Today" : key;
    if (dv.contentLoading && dv.contentForDate === key){
      mount.innerHTML = '<div class="section card-tight"><div class="loader"><span class="spin"></span> Preparing '+esc(label)+'’s devotional&hellip;</div></div>';
      return;
    }
    if (dv.contentError && dv.contentForDate === key){
      mount.innerHTML = '<div class="section card-tight">'+errorBanner(dv.contentError)+'<button type="button" class="btn btn-outline" id="dv-retry">Try Again</button></div>';
      var retryBtn = document.getElementById("dv-retry");
      if (retryBtn) retryBtn.addEventListener("click", function(){ loadDevotionalContent(key); });
      return;
    }
    if (!dv.content || dv.contentForDate !== key){
      loadDevotionalContent(key);
      mount.innerHTML = '<div class="section card-tight"><div class="loader"><span class="spin"></span> Loading&hellip;</div></div>';
      return;
    }
    var c = dv.content;
    var done = !!(dv.progress && dv.progress.days && dv.progress.days[key]);
    var html = '<div class="section" style="border-left:4px solid var(--plum);">';
    html += '<h1 class="lecture-print-title">'+esc(label)+'&rsquo;s Reading</h1>';
    html += '<p class="lecture-print-ref">'+esc(c.reference||"")+' &middot; Honouring Him Daily Devotional</p>';
    html += '<div class="section-head no-print"><h3>'+esc(label)+'’s Reading</h3><span class="tag tag-alone">'+ICON_BOOK+' '+esc(c.reference||"")+'</span></div>';
    html += '<div class="summary-text" style="margin-bottom:14px;">'+linkGlossary(c.scriptureSummary||"")+'</div>';
    html += '<div class="divider no-print"></div>';
    html += '<h4 style="font-size:15px;margin-bottom:8px;">Reflection</h4>';
    html += '<p style="font-size:15px;line-height:1.7;margin-bottom:16px;">'+nl2br(c.reflection||"")+'</p>';
    html += '<div class="banner banner-info"><span>'+ICON_HANDS+'</span><span><strong>Prayer:</strong> '+esc(c.prayer||"")+'</span></div>';
    html += '<div class="devo-print-prayer"><strong>Prayer:</strong> '+esc(c.prayer||"")+'</div>';
    html += '<div class="print-progress-note">Name: '+esc((state.me&&state.me.name)||"")+' &nbsp;&nbsp;&nbsp; Completed on: ________________</div>';
    html += '<div class="btn-row no-print" style="margin-top:16px;gap:10px;flex-wrap:wrap;">';
    html += '<button type="button" class="btn '+(done?"btn-primary":"btn-outline")+'" id="dv-mark-done" style="flex:1;min-width:200px;">'+(done?(ICON_CHECK+" Done"):"Mark This Reading Done")+'</button>';
    html += '<button type="button" class="btn btn-outline" id="dv-print">'+ICON_BOOK+' Print This Day</button>';
    html += '</div>';
    html += '</div>';
    mount.innerHTML = html;
    on("dv-mark-done","click", function(){ toggleDevotionalDone(key); });
    on("dv-print","click", function(){ window.print(); });
  }

  function loadDevotionalProgress(){
    var dv = ensureDevotionalState();
    dv.progressLoaded = true;
    getDb().then(function(db){
      if (!db){ dv.progress = {days:{}}; render(); return; }
      db.doc("devotionalProgress/"+state.me.id).get().then(function(snap){
        dv.progress = snap.exists ? snap.data() : {days:{}};
        if (!dv.progress.days) dv.progress.days = {};
        render();
      }).catch(function(){ dv.progress = {days:{}}; render(); });
    });
  }

  function loadDevotionalContent(key){
    var dv = ensureDevotionalState();
    var denom = (state.me && state.me.denomination) || "none";
    var docKey = key + "_" + denom;
    dv.contentLoading = true; dv.contentForDate = key; dv.contentError = null; dv.content = null;
    renderDevotionalContent();
    getDb().then(function(db){
      var ref = db ? db.doc("devotionals/"+docKey) : null;
      var cached = ref ? ref.get().then(function(snap){ return snap.exists ? snap.data() : null; }).catch(function(){ return null; }) : Promise.resolve(null);
      cached.then(function(existing){
        if (dv.selectedDate !== key) return;
        if (existing){
          dv.content = existing; dv.contentLoading = false; renderDevotionalContent();
          return;
        }
        getSample().then(function(sample){
          if (dv.selectedDate !== key) return;
          if (!sample){
            dv.contentLoading = false;
            dv.contentError = "This device can't reach Honouring Him's writing assistant right now, so this day's devotional can't be prepared here.";
            renderDevotionalContent();
            return;
          }
          sample.json(buildDevotionalPrompt(denom), {modelTier:"complex"}).then(function(data){
            if (dv.selectedDate !== key) return;
            dv.content = data; dv.contentLoading = false; renderDevotionalContent();
            if (ref) ref.set(Object.assign({date:key, denomination:denom}, data, {generatedAt: new Date().toISOString()})).catch(function(){});
          }).catch(function(err){
            if (dv.selectedDate !== key) return;
            dv.contentLoading = false;
            dv.contentError = sampleErrorCopy(err);
            renderDevotionalContent();
          });
        });
      });
    });
  }

  function buildDevotionalPrompt(denom){
    var p = "Write ONE short daily devotional reading for a Christian Bible app, meant for a solo 5-10 minute reading.\n";
    p += "Denomination/tradition: " + denomLabel(denom) + ". Keep teaching simple, warm, and Christ-centered; do not take sides on denominational disputes, but you may use natural, familiar language, phrasing, and emphasis for this tradition.\n";
    p += "Choose any scripture passage well-suited to daily devotional reading — Psalms, Proverbs, the Gospels, the Epistles, Old Testament narrative, anywhere — and vary your choice; avoid only ever picking the handful of most famous verses.\n\n";
    p += "Reply with ONLY a JSON object:\n{\n";
    p += '  "reference": "the scripture reference chosen",\n';
    p += '  "scriptureSummary": "80-140 word plain-language paraphrase of the passage IN YOUR OWN WORDS — never quote a specific Bible translation verbatim",\n';
    p += '  "reflection": "180-260 words of warm, practical reflection connecting the passage to ordinary daily life — concrete and relatable, not abstract theological language",\n';
    p += '  "prayer": "a short 40-70 word prayer someone could pray in response, written in first person"\n';
    p += "}\nReply with ONLY the JSON object, no other text.";
    return p;
  }

  function toggleDevotionalDone(key){
    var dv = ensureDevotionalState();
    var currentlyDone = !!(dv.progress && dv.progress.days && dv.progress.days[key]);
    var newVal = !currentlyDone;
    getDb().then(function(db){
      if (!db) return;
      var ref = db.doc("devotionalProgress/"+state.me.id);
      var patch = {personId: state.me.id, name: state.me.name, days:{}};
      patch.days[key] = newVal;
      ref.update(patch).catch(function(){ return ref.set(patch); }).then(function(){
        if (!dv.progress) dv.progress = {days:{}};
        if (!dv.progress.days) dv.progress.days = {};
        dv.progress.days[key] = newVal;
        render();
      });
    });
  }

  function wireDevotional(){
    var dv = ensureDevotionalState();
    document.querySelectorAll("[data-dv-date]").forEach(function(btn){
      btn.addEventListener("click", function(){
        dv.selectedDate = btn.getAttribute("data-dv-date");
        dv.content = null; dv.contentForDate = null; dv.contentError = null;
        render();
      });
    });
    on("dv-prev","click", function(){
      dv.viewMonth--; if (dv.viewMonth < 0){ dv.viewMonth = 11; dv.viewYear--; }
      render();
    });
    on("dv-next","click", function(){
      dv.viewMonth++; if (dv.viewMonth > 11){ dv.viewMonth = 0; dv.viewYear++; }
      render();
    });
    renderDevotionalContent();
  }

  var glossState = {query:""};

  function screenGlossary(){
    var html = '<div class="wrap-narrow">';
    html += '<div style="margin:22px 0 18px;"><span class="eyebrow">Bible Glossary</span><h1 style="font-size:28px;margin-top:4px;">What does that word mean?</h1><p class="muted" style="margin-top:8px;">Search any word you come across in your reading. Words underlined inside your studies can also be tapped directly.</p></div>';
    html += '<div class="gloss-search">'+ICON_SEARCH+'<input class="input" id="gl-search" placeholder="Try “covenant,” “grace,” or “Pentecost”&hellip;" value="'+esc(glossState.query)+'" autocomplete="off"></div>';
    html += '<div class="card" id="gl-results"></div>';
    html += '</div>';
    return html;
  }

  function renderGlossResults(){
    var mount = document.getElementById("gl-results");
    if (!mount) return;
    var q = glossState.query.trim().toLowerCase();
    var matches = !q ? GLOSSARY.map(function(g,i){return i;}) : GLOSSARY.map(function(g,i){return i;}).filter(function(i){
      return GLOSSARY[i][0].toLowerCase().indexOf(q) !== -1 || GLOSSARY[i][1].toLowerCase().indexOf(q) !== -1;
    });
    matches = matches.slice().sort(function(a,b){ return GLOSSARY[a][0].localeCompare(GLOSSARY[b][0]); });
    if (matches.length){
      mount.innerHTML = matches.map(function(i){
        return '<div class="gloss-entry"><h4>'+esc(GLOSSARY[i][0])+'</h4><p>'+esc(GLOSSARY[i][1])+'</p></div>';
      }).join("");
      return;
    }
    if (!q){ mount.innerHTML = '<p class="muted">Start typing to search.</p>'; return; }
    mount.innerHTML = '<div id="gl-lookup"><p class="muted" style="margin-bottom:14px;">We don\'t have &ldquo;'+esc(glossState.query.trim())+'&rdquo; in our list yet.</p>' +
      '<button class="btn btn-outline" id="gl-ask">Look It Up</button></div>';
    on("gl-ask","click", function(){ lookupWordLive(glossState.query.trim()); });
  }

  function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,80) || "word"; }

  function lookupWordLive(word){
    var lookupEl = document.getElementById("gl-lookup");
    if (lookupEl) lookupEl.innerHTML = '<div class="loader"><span class="spin"></span> Looking that up&hellip;</div>';
    var slug = slugify(word);
    getDb().then(function(db){
      var afterCache = function(){
        getSample().then(function(sample){
          if (!sample){
            if (lookupEl) lookupEl.innerHTML = errorBanner("Word lookup isn't available on this device right now.");
            return;
          }
          var prompt = 'Someone studying the Bible wants to know what "' + word + '" means in a biblical/Christian context. ' +
            'Reply with ONLY a JSON object: {"term": "the word or phrase, tidied up", "definition": "a clear, simple, neutral 1-3 sentence definition suitable for any Christian tradition"}. ' +
            'If it is not a biblical or Christian term, still give a brief, honest, neutral definition.';
          sample.json(prompt, {modelTier:"quick"}).then(function(data){
            if (lookupEl) lookupEl.innerHTML = '<div class="gloss-entry"><h4>'+esc(data.term||word)+'</h4><p>'+esc(data.definition||"")+'</p></div>';
            if (db) db.doc("glossary/"+slug).set({term:data.term||word, definition:data.definition||"", createdAt:new Date().toISOString()}).catch(function(){});
          }).catch(function(err){
            if (lookupEl) lookupEl.innerHTML = errorBanner(sampleErrorCopy(err));
          });
        });
      };
      if (!db){ afterCache(); return; }
      db.doc("glossary/"+slug).get().then(function(snap){
        if (snap.exists){
          var d = snap.data();
          if (lookupEl) lookupEl.innerHTML = '<div class="gloss-entry"><h4>'+esc(d.term)+'</h4><p>'+esc(d.definition)+'</p></div>';
        } else afterCache();
      }).catch(afterCache);
    });
  }

  function wireGlossary(){
    renderGlossResults();
    on("gl-search","input", function(){ glossState.query = val("gl-search"); renderGlossResults(); });
  }

  function boot(initial){
    if (initial && initial.draftAnswers) state.draftAnswers = initial.draftAnswers;

      var term = e.target.closest ? e.target.closest(".gloss-term") : null;
      if (term){ showGlossTerm(parseInt(term.getAttribute("data-gidx"),10)); return; }
      if (e.target.id === "gloss-sheet-close" || e.target.id === "gloss-sheet-backdrop"){ hideGlossSheet(); }
    });
    document.addEventListener("keydown", function(e){
      if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("gloss-term")){
        e.preventDefault(); showGlossTerm(parseInt(e.target.getAttribute("data-gidx"),10));
      }
      if (e.key === "Escape") hideGlossSheet();
    });
    go(state.me ? "home" : "profile");
  }

  function start(initialData){
    boot({draftAnswers: (initialData && initialData.draftAnswers) || {}});
  }
  start({});
})();
</script>
</body>
</html>
